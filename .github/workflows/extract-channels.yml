name: Extract TV Channels

on:
  # Run manually from GitHub UI
  workflow_dispatch:

  # Run automatically on schedule (e.g., daily at 2 AM)
  schedule:
    - cron: "0 2 * * *"

  # Optional: Run on push to main branch
  push:
    branches: [main]
    paths:
      - "extractor.js"
      - "package.json"

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          # Install system dependencies for Puppeteer
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libappindicator3-1 \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libgdk-pixbuf2.0-0 \
            libnspr4 \
            libnss3 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            xdg-utils

      - name: Run extraction script
        run: node extractor.js
        env:
          # Optional: Add any API keys or configuration
          NODE_ENV: production

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-channels
          path: output/
          retention-days: 30

      - name: Create release with latest data (optional)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Channel Data
          body: |
            Automated extraction of TV channels from elahmad.com
            Generated on: ${{ github.event.repository.updated_at }}
          files: |
            output/*.json
            output/*.csv
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
